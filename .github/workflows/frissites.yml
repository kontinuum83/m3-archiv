name: Friss műsorok frissítése

on:
  schedule:
    - cron: "17 */6 * * *"   # 6 óránként
  workflow_dispatch:          # kézzel is indítható

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python update_feed.py
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add feed.json
          git diff --cached --quiet || (git commit -m "Friss műsorlista" && git push)
